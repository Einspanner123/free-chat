[project]
name = "freechat-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "freechat-contracts",
  "freechat-protocol",
  "grpcio>=1.74,<2",
  "httpx>=0.28,<1",
  "nvidia-ml-py>=13.580,<14",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
gpu = [
  "torch==2.13.0",
  "transformers==5.14.1",
  "triton==3.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freechat_worker"]

[tool.uv.sources]
freechat-contracts = { workspace = true }
freechat-protocol = { workspace = true }
