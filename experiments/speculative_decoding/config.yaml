# Speculative Decoding Experiment Configuration

experiment:
  name: "speculative_decoding"
  seed: 42

target_model:
  params_b: 7
  latency_ms: 50.0

draft_models:
  - name: "0.5B"
    params_b: 0.5
    latency_ms: 8.0
  - name: "1.5B"
    params_b: 1.5
    latency_ms: 15.0

gammas: [1, 3, 5, 7]
acceptance_rates: [0.6, 0.7, 0.8, 0.9]

output:
  results_dir: "results"
  plots_dir: "plots"
