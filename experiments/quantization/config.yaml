# Quantization Benchmark Configuration
# Usage: python run.py --config config.yaml

experiment:
  name: "quantization_benchmark"
  seed: 42

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  params_b: 7
  layers: 28
  heads: 28
  head_dim: 128

benchmark:
  methods:
    - name: "fp16"
      label: "FP16"
      bits: 16
    - name: "int8"
      label: "INT8"
      bits: 8
    - name: "gptq"
      label: "GPTQ INT4"
      bits: 4
    - name: "awq"
      label: "AWQ INT4"
      bits: 4
    - name: "fp8"
      label: "FP8 (E4M3)"
      bits: 8

  eval_datasets:
    - "mmlu"
    - "gsm8k"
    - "ceval"

output:
  results_dir: "results"
  plots_dir: "plots"
  report_file: "report.md"
