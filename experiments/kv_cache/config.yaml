# KV Cache Experiment Configuration

experiment:
  name: "kv_cache_experiment"
  seed: 42

model:
  params_b: 7
  layers: 28
  heads: 28
  head_dim: 128

methods:
  - name: "no_cache"
    label: "No Cache"
  - name: "kv_cache"
    label: "KV Cache"
  - name: "prefix_cache"
    label: "Prefix Cache"

sequence_lengths: [128, 512, 1024, 4096, 8192, 16384, 32768]

output:
  results_dir: "results"
  plots_dir: "plots"
