[project]
name = "freechat-infra-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "worker"]

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-psutil>=7.0,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "libs", "services", "worker"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "gpu: requires a real CUDA GPU and pinned worker image",
  "multinode: requires ross and workstation",
  "scale: synthetic control-plane scale validation",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
