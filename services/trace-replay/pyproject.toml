[project]
name = "freechat-trace-replay"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "freechat-contracts",
  "freechat-control-store",
  "nats-py>=2.11,<3",
  "pyarrow>=21,<22",
  "pydantic>=2.11,<3",
  "zstandard>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freechat_trace_replay"]

[tool.uv.sources]
freechat-contracts = { workspace = true }
freechat-control-store = { workspace = true }
