[project]
name = "freechat-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "authlib>=1.6,<2",
  "fastapi>=0.116,<1",
  "freechat-contracts",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
freechat-gateway = "freechat_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freechat_gateway"]

[tool.uv.sources]
freechat-contracts = { workspace = true }
