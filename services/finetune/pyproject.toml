[project]
name = "finetune"
version = "0.1.0"
description = "LoRA/QLoRA Fine-tuning Pipeline for LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "datasets>=2.14",
    "accelerate>=0.28",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
