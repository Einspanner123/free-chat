[project]
name = "llm-inference"
version = "0.1.0"
description = "LLM Inference Service with pluggable engines (HF, vLLM) and quantization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "grpcio-tools>=1.76.0",
    "loguru>=0.7.3",
    "protobuf>=6.33.1",
    "torch>=2.9.1",
    "transformers>=4.57.1",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
