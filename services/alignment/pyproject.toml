[project]
name = "alignment"
version = "0.1.0"
description = "DPO Alignment Pipeline for LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.9",
    "datasets>=2.14",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
