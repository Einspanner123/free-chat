[project]
name = "freechat-harness-adapters"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["freechat-contracts", "pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freechat_harness_adapters"]

[tool.uv.sources]
freechat-contracts = { workspace = true }
